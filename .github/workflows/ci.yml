name: CI

on:
  push:
    branches: ["main", "master", "feat/**", "track/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint gate
        run: ruff check app/ tests/ eval/

      - name: Unit and integration test gate
        run: pytest --ignore=tests/test_hybrid_retriever.py -q

      - name: DEPI SLO evaluation gate
        run: python eval/run_eval.py
