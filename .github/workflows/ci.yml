name: CI

on:
  push:
    branches: ["main", "master", "feat/**", "track/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff lint gate
        run: ruff check app/ tests/ eval/
      - name: Unit and integration test gate
        env:
          SKIP_QDRANT_AUTO_INGEST: "1"
        run: pytest --ignore=tests/test_hybrid_retriever.py -q
      - name: DEPI SLO evaluation gate
        run: python eval/run_eval.py

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend bundle
        run: npm run build
