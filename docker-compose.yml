# Local infrastructure for the RAG index and the zero-PHI audit database.
#   docker compose up -d
#   DATABASE_URL=postgresql+asyncpg://shefaguide:shefaguide@localhost:5432/shefaguide
#   QDRANT_URL=http://localhost:6333
services:
  postgres:
    image: postgres:17.6
    container_name: shefaguide-postgres
    environment:
      POSTGRES_USER: shefaguide
      POSTGRES_PASSWORD: shefaguide
      POSTGRES_DB: shefaguide
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shefaguide -d shefaguide"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: shefaguide-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
